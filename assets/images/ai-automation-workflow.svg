<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg3)"/>
  
  <!-- Title -->
  <text x="600" y="50" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="white" text-anchor="middle">AI Automation Workflow Example</text>
  <rect x="350" y="60" width="500" height="2" fill="#3b82f6"/>
  
  <!-- Step 1: Customer Inquiry -->
  <rect x="50" y="120" width="180" height="100" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="140" y="155" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#3b82f6" text-anchor="middle">STEP 1</text>
  <text x="140" y="180" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Customer Inquiry</text>
  <text x="140" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Website Form</text>
  
  <!-- Arrow 1 -->
  <line x1="230" y1="170" x2="290" y2="170" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2: AI Processing -->
  <rect x="300" y="120" width="180" height="100" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="390" y="155" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#8b5cf6" text-anchor="middle">STEP 2</text>
  <text x="390" y="180" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">AI Categorizes</text>
  <text x="390" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Type &amp; Urgency</text>
  
  <!-- Arrow 2 -->
  <line x1="480" y1="170" x2="540" y2="170" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3: CRM Update -->
  <rect x="550" y="120" width="180" height="100" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="640" y="155" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#10b981" text-anchor="middle">STEP 3</text>
  <text x="640" y="180" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">CRM Updated</text>
  <text x="640" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Contact Added</text>
  
  <!-- Arrow 3 -->
  <line x1="730" y1="170" x2="790" y2="170" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 4: Response -->
  <rect x="800" y="120" width="180" height="100" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="890" y="155" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f59e0b" text-anchor="middle">STEP 4</text>
  <text x="890" y="180" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">AI Drafts Reply</text>
  <text x="890" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Personalized Email</text>
  
  <!-- Arrow 4 -->
  <line x1="980" y1="170" x2="1040" y2="170" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 5: Team Notified -->
  <rect x="1050" y="120" width="130" height="100" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="1115" y="155" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ef4444" text-anchor="middle">STEP 5</text>
  <text x="1115" y="180" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Notified</text>
  <text x="1115" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Slack Alert</text>
  
  <!-- Bottom flow: Follow-up -->
  <rect x="200" y="300" width="800" height="80" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="600" y="330" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">AUTOMATED FOLLOW-UP SEQUENCE</text>
  <text x="600" y="355" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Day 1: Thank-you email  |  Day 3: Follow-up  |  Day 7: Calendar booking link</text>
  
  <!-- Tools used -->
  <text x="600" y="440" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">Tools Used in This Workflow</text>
  
  <g font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">
    <rect x="150" y="460" width="140" height="35" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="220" y="483" text-anchor="middle">Zapier / Make</text>
    
    <rect x="310" y="460" width="140" height="35" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="380" y="483" text-anchor="middle">ChatGPT API</text>
    
    <rect x="470" y="460" width="140" height="35" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="540" y="483" text-anchor="middle">HubSpot CRM</text>
    
    <rect x="630" y="460" width="140" height="35" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="700" y="483" text-anchor="middle">Gmail / SMTP</text>
    
    <rect x="790" y="460" width="140" height="35" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
    <text x="860" y="483" text-anchor="middle">Slack</text>
  </g>
  
  <!-- Brand -->
  <text x="600" y="590" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">AI EARN HUB â ai-earn-hub.com</text>
</svg>
