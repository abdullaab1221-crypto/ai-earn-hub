<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg4)"/>
  
  <!-- Title -->
  <text x="600" y="50" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="white" text-anchor="middle">How to Choose the Right AI Tool</text>
  <rect x="380" y="60" width="440" height="2" fill="#3b82f6"/>
  
  <!-- Central question -->
  <circle cx="600" cy="160" r="50" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="155" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#3b82f6" text-anchor="middle">YOUR</text>
  <text x="600" y="172" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#3b82f6" text-anchor="middle">NEED?</text>
  
  <!-- Branches -->
  <!-- Marketing -->
  <line x1="520" y1="200" x2="200" y2="280" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="80" y="280" width="240" height="90" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="200" y="310" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#8b5cf6" text-anchor="middle">MARKETING</text>
  <text x="200" y="335" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Canva AI, Jasper,</text>
  <text x="200" y="352" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Adobe Express AI</text>
  
  <!-- Sales -->
  <line x1="560" y1="200" x2="420" y2="280" stroke="#10b981" stroke-width="2"/>
  <rect x="300" y="280" width="240" height="90" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="420" y="310" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#10b981" text-anchor="middle">SALES &amp; CRM</text>
  <text x="420" y="335" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">HubSpot, Shopify</text>
  <text x="420" y="352" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Sidekick</text>
  
  <!-- Content -->
  <line x1="640" y1="200" x2="780" y2="280" stroke="#f59e0b" stroke-width="2"/>
  <rect x="660" y="280" width="240" height="90" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="780" y="310" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f59e0b" text-anchor="middle">CONTENT</text>
  <text x="780" y="335" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">ChatGPT, Claude,</text>
  <text x="780" y="352" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Grammarly</text>
  
  <!-- Automation -->
  <line x1="680" y1="200" x2="1000" y2="280" stroke="#ef4444" stroke-width="2"/>
  <rect x="880" y="280" width="240" height="90" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
  <text x="1000" y="310" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ef4444" text-anchor="middle">AUTOMATION</text>
  <text x="1000" y="335" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Zapier, Make,</text>
  <text x="1000" y="352" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">HubSpot</text>
  
  <!-- Decision factors -->
  <text x="600" y="420" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">Key Decision Factors</text>
  
  <g font-family="system-ui, sans-serif" font-size="13">
    <rect x="100" y="445" width="200" height="60" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="200" y="470" font-weight="600" fill="#3b82f6" text-anchor="middle">Budget</text>
    <text x="200" y="490" fill="#94a3b8" text-anchor="middle">Free vs Paid</text>
    
    <rect x="330" y="445" width="200" height="60" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="430" y="470" font-weight="600" fill="#8b5cf6" text-anchor="middle">Team Size</text>
    <text x="430" y="490" fill="#94a3b8" text-anchor="middle">Solo vs Team</text>
    
    <rect x="560" y="445" width="200" height="60" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="660" y="470" font-weight="600" fill="#10b981" text-anchor="middle">Integration</text>
    <text x="660" y="490" fill="#94a3b8" text-anchor="middle">Existing Tools</text>
    
    <rect x="790" y="445" width="200" height="60" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="890" y="470" font-weight="600" fill="#f59e0b" text-anchor="middle">Scale</text>
    <text x="890" y="490" fill="#94a3b8" text-anchor="middle">Growth Plans</text>
  </g>
  
  <!-- Tip -->
  <rect x="250" y="530" width="700" height="50" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="600" y="560" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Start with free tiers, test with real tasks, then upgrade the tools that deliver the most value.</text>
  
  <!-- Brand -->
  <text x="600" y="615" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">AI EARN HUB â ai-earn-hub.com</text>
</svg>
